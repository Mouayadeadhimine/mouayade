<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Infinity Reel</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html,body{margin:0;padding:0;background:#111}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#EFE3CC}
  .scene{position:absolute;inset:0;overflow:hidden;display:none}
  .cam{position:absolute;inset:0;transform-origin:50% 46%}
  .layer{position:absolute;inset:0}
  .a{position:absolute;transform-origin:50% 50%}
  .bg{position:absolute;left:-80px;top:-80px;width:1240px;height:2080px;background-size:100% 100%}
  .head{font-family:'Anton',sans-serif;color:#1E1A16;text-transform:uppercase;line-height:.98;text-align:center;letter-spacing:1px;
        text-shadow:0 3px 0 rgba(255,250,235,.55)}
  .tag{font-family:'Special Elite',monospace;background:#fff;color:#1E1A16;border-radius:18px;padding:10px 24px;font-size:38px;
       box-shadow:0 5px 12px rgba(40,25,10,.28);white-space:nowrap}
  .hand{font-family:'Caveat',cursive;color:#2b2420}
  .shadow{filter:drop-shadow(0 10px 14px rgba(40,25,10,.35))}
  .sticker{filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 8px 10px rgba(40,25,10,.35))}
  .card{background:#faf6ec;padding:14px 14px 0;box-sizing:border-box}
  .card .ph{position:relative;overflow:hidden;background:linear-gradient(160deg,#d8c19b,#b39570 70%,#9c7f5c)}
  .card .ph svg{display:block;width:100%;height:auto}
  .card .lb{font-family:'Special Elite',monospace;font-size:30px;text-align:center;color:#2b2420;padding:10px 4px 14px;letter-spacing:1px}
  .tape{position:absolute;left:50%;top:-22px;width:130px;height:44px;margin-left:-65px;background:rgba(236,226,196,.78);
        box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .bubble{background:#fff;border:6px solid #1E1A16;border-radius:46px;padding:26px 34px;box-sizing:border-box;
          font-family:'Anton',sans-serif;color:#1E1A16;text-transform:uppercase;text-align:center;line-height:1.05}
  .bubble .tail{position:absolute;width:46px;height:46px;background:#fff;border-left:6px solid #1E1A16;border-bottom:6px solid #1E1A16}
  .hl{display:inline-block;padding:0 14px;border-radius:14px}
  #caps{position:absolute;left:70px;width:940px;top:1462px;text-align:center;z-index:40;pointer-events:none}
  .chunk{display:none;font-family:'Archivo Black',sans-serif;font-size:56px;line-height:1.28;color:#fff;text-transform:uppercase;
         text-shadow:0 5px 0 #1E1A16,0 0 18px rgba(0,0,0,.65),3px 0 0 #1E1A16,-3px 0 0 #1E1A16,0 -3px 0 #1E1A16}
  .chunk span{display:inline-block;margin:0 6px;padding:0 10px;border-radius:16px}
  .chunk span.on{background:#F5A623;color:#1E1A16;text-shadow:none;box-shadow:0 5px 0 #1E1A16}
  #grain{position:absolute;left:-200px;top:-200px;width:1480px;height:2320px;z-index:50;mix-blend-mode:overlay;opacity:.22;pointer-events:none;background-size:740px 1160px}
  #vig{position:absolute;inset:0;z-index:45;pointer-events:none;background:radial-gradient(ellipse 75% 62% at 50% 46%,rgba(0,0,0,0) 58%,rgba(45,28,12,.42) 100%)}
  #tear{position:absolute;top:-40px;width:1400px;height:2000px;z-index:60;display:none}
  #flash{position:absolute;inset:0;z-index:61;background:#fff8e6;opacity:0;pointer-events:none}
  #fade{position:absolute;inset:0;z-index:62;opacity:0;background-size:100% 100%}
  .film{position:absolute;top:0;width:78px;height:1920px;background:#0d0c0b}
  .film i{position:absolute;left:20px;width:38px;height:26px;border-radius:6px;background:#3a3631}
  .num{position:absolute;left:0;width:1080px;text-align:center;font-family:'Anton',sans-serif;color:#F3E7D0;white-space:nowrap}
  .num sup{font-size:.55em;vertical-align:.75em}
  .lines{background:repeating-linear-gradient(180deg,rgba(60,45,30,.0) 0 18px,rgba(60,45,30,.32) 18px 22px)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="pencil" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5"/>
    </filter>
    <filter id="ink" x="-10%" y="-30%" width="120%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="3" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="9"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <rect width="9" height="9" fill="rgba(255,255,255,0)"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#3a332d" stroke-width="1.6" opacity=".5"/>
    </pattern>
    <pattern id="hatch2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#2a2420" stroke-width="2" opacity=".55"/>
    </pattern>
    <pattern id="grid" width="45" height="45" patternUnits="userSpaceOnUse">
      <path d="M45,0 L0,0 0,45" fill="none" stroke="#6f93a8" stroke-width="1.2" opacity=".35"/>
    </pattern>
  </defs>
</svg>

<div id="stage">
  <div id="scenes"></div>
  <div id="caps"></div>
  <div id="vig"></div>
  <div id="grain"></div>
  <div id="tear"></div>
  <div id="flash"></div>
  <div id="fade"></div>
</div>

<script src="words.js"></script>
<script>
"use strict";
/* ============ utilities ============ */
const FPS = 30, DUR = 69.77;
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const p2o=x=>1-(1-x)*(1-x), p3o=x=>1-Math.pow(1-x,3), p2io=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2, p3io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const backOut=(x,s=1.9)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);
const prog=(t,a,d)=>clamp((t-a)/d);
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild};

const INK='#1E1A16', CREAM='#EFE3CC';
const PEN='stroke="#3a332d" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"';

/* ============ textures ============ */
function paperTex(w,h,seed,o){
  const R=rng(seed), c=document.createElement('canvas'); c.width=w;c.height=h; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,w*.35,h); o.cols.forEach((col,i)=>g.addColorStop(i/(o.cols.length-1),col));
  x.fillStyle=g; x.fillRect(0,0,w,h);
  for(let i=0;i<(o.blot||40);i++){const cx=R()*w,cy=R()*h,r=40+R()*Math.max(w,h)*.22;const rg=x.createRadialGradient(cx,cy,0,cx,cy,r);
    const dk=R()<.6; rg.addColorStop(0,dk?`rgba(${o.ink||'110,80,45'},${.04+R()*.07})`:`rgba(255,250,235,${o.dark?0.02:0.09})`); rg.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=rg; x.fillRect(cx-r,cy-r,2*r,2*r);}
  for(let i=0;i<(o.rings||0);i++){const cx=R()*w,cy=R()*h,r=45+R()*100;x.strokeStyle=`rgba(125,78,32,${.10+R()*.12})`;x.lineWidth=3+R()*7;
    x.beginPath();x.arc(cx,cy,r,R()*6,R()*6+4.2+R()*1.9);x.stroke();x.fillStyle='rgba(140,90,40,0.045)';x.beginPath();x.arc(cx,cy,r,0,7);x.fill();}
  for(let i=0;i<(o.crease||0);i++){let px=R()*w,py=R()*h,a=R()*6.28;x.lineWidth=1.5+R()*1.5;
    const pts=[[px,py]];for(let k=0;k<6;k++){a+=R()*.8-.4;px+=Math.cos(a)*(60+R()*120);py+=Math.sin(a)*(60+R()*120);pts.push([px,py]);}
    x.strokeStyle='rgba(255,255,255,0.07)';x.beginPath();pts.forEach((p,k)=>k?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();
    x.strokeStyle='rgba(0,0,0,0.25)';x.beginPath();pts.forEach((p,k)=>k?x.lineTo(p[0]+2,p[1]+2):x.moveTo(p[0]+2,p[1]+2));x.stroke();
    const f=pts[Math.floor(R()*5)];x.fillStyle=R()<.5?'rgba(255,255,255,0.035)':'rgba(0,0,0,0.12)';x.beginPath();x.moveTo(f[0],f[1]);x.lineTo(f[0]+R()*400-200,f[1]+R()*400-200);x.lineTo(f[0]+R()*400-200,f[1]+R()*400-200);x.fill();}
  x.lineWidth=1;for(let i=0;i<(o.fib||500);i++){const px=R()*w,py=R()*h;x.strokeStyle=`rgba(${o.ink||'110,80,45'},${.05+R()*.06})`;
    x.beginPath();x.moveTo(px,py);x.quadraticCurveTo(px+R()*20-10,py+R()*20-10,px+R()*34-17,py+R()*34-17);x.stroke();}
  const id=x.getImageData(0,0,w,h),d=id.data,N=o.noise||22;for(let i=0;i<d.length;i+=4){const n=(R()-.5)*N;d[i]+=n;d[i+1]+=n;d[i+2]+=n;}
  x.putImageData(id,0,0);
  return c.toDataURL('image/jpeg',.9);
}
function grainTex(){const R=rng(77),c=document.createElement('canvas');c.width=370;c.height=580;const x=c.getContext('2d');
  const id=x.createImageData(370,580),d=id.data;for(let i=0;i<d.length;i+=4){const v=R()*255;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}x.putImageData(id,0,0);return c.toDataURL('image/png');}
function torn(w,h,seed,amp=9,step=13){const R=rng(seed),p=[];
  for(let x=0;x<=w;x+=step)p.push([x,R()*amp]);for(let y=0;y<=h;y+=step)p.push([w-R()*amp,y]);
  for(let x=w;x>=0;x-=step)p.push([x,h-R()*amp]);for(let y=h;y>=0;y-=step)p.push([R()*amp,y]);
  return `polygon(${p.map(q=>q[0].toFixed(1)+'px '+q[1].toFixed(1)+'px').join(',')})`;}

/* ============ drawings ============ */
function lemD(w,h,pad,n=160){let d='';for(let i=0;i<=n;i++){const t=Math.PI/2+i/n*Math.PI*2;const s=Math.sin(t),c=Math.cos(t),k=1+s*s;
  const X=w/2+(c/k)*(w/2-pad),Y=h/2+(s*c/k)/.3536*(h/2-pad);d+=(i?'L':'M')+X.toFixed(1)+','+Y.toFixed(1);}return d;}
function infSvg(w,h,o={}){const sw=o.sw||Math.max(6,h*.13);const col=o.col||INK;const d=lemD(w,h,sw*.9);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="overflow:visible;display:block">
   <g filter="url(#ink)"><path class="infp" ${o.draw?`data-draw="${o.draw}" data-dur="${o.dur||.9}"`:''} d="${d}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/></g></svg>`;}
function infInline(sz,col){return `<svg width="${sz*1.9}" height="${sz}" viewBox="0 0 ${sz*1.9} ${sz}" style="display:inline-block;vertical-align:-.08em;overflow:visible"><path d="${lemD(sz*1.9,sz*.9,sz*.12)}" transform="translate(0,${sz*.05})" fill="none" stroke="${col||INK}" stroke-width="${sz*.15}" stroke-linecap="round"/></svg>`;}

function curls(cx,cy,rx,ry,a0,a1,n,r){let d='';for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,x=cx+rx*Math.cos(a),y=cy+ry*Math.sin(a);
  d+=`M${(x+r).toFixed(1)},${y.toFixed(1)} a${r},${r} 0 1,0 ${-2*r},0 a${r},${r} 0 1,0 ${2*r},0 `;}return d;}
function bust(kind){
  const skin='#e9d8b8', robeL='#d9c6a2', dark='#3b332d';
  const face=`<path ${PEN} d="M120,134 q12,-8 26,-2 M156,132 q14,-6 26,2"/>
    <path ${PEN} d="M124,148 q10,-7 20,0 M158,148 q10,-7 20,0"/><circle cx="134" cy="149" r="3.4" fill="#3a332d"/><circle cx="168" cy="149" r="3.4" fill="#3a332d"/>
    <path ${PEN} d="M151,152 q-7,22 -3,31 q7,4 12,-1"/><path ${PEN} d="M136,198 q14,6 28,0"/>
    <path ${PEN} d="M95,148 q-13,6 -4,30 M205,148 q13,6 4,30"/>
    <path d="M178,110 l12,10 M184,124 l12,10 M186,140 l12,10 M186,158 l12,10 M182,176 l10,9" stroke="#3a332d" stroke-width="1.6" opacity=".45"/>`;
  const head=`<ellipse cx="150" cy="152" rx="56" ry="70" fill="${skin}" ${PEN.replace('fill="none"','')}/>`;
  const neck=`<path d="M126,206 L122,258 L178,258 L174,206 Z" fill="${skin}" ${PEN.replace('fill="none"','')}/>`;
  const sh=(f)=>`<path d="M14,345 C24,284 86,250 150,250 C214,250 276,284 286,345 Z" fill="${f}" ${PEN.replace('fill="none"','')}/><path d="M14,345 C24,284 86,250 150,250 C214,250 276,284 286,345 Z" fill="url(#hatch)" opacity=".7"/>`;
  let back='',body=sh(robeL),top='',extra='';
  if(kind==='aristotle'){
    top=`<path d="${curls(150,118,58,46,Math.PI*1.02,Math.PI*1.98,9,10)}" fill="${skin}" ${PEN.replace('fill="none"','')}/>`;
    extra=`<path d="M96,166 C92,218 114,264 150,272 C186,264 208,218 204,166 C190,202 170,208 150,208 C130,208 110,202 96,166Z" fill="#cdbb98" ${PEN.replace('fill="none"','')}/>
      <path d="M96,166 C92,218 114,264 150,272 C186,264 208,218 204,166 C190,202 170,208 150,208 C130,208 110,202 96,166Z" fill="url(#hatch2)" opacity=".5"/>
      <path ${PEN} d="${curls(150,226,44,40,Math.PI*.15,Math.PI*.85,6,8)}"/><path ${PEN} d="M126,190 q24,-12 48,0"/>
      <path ${PEN} d="M36,330 C110,300 180,292 232,262"/><circle cx="234" cy="264" r="11" ${PEN}/>`;
  } else if(kind==='brahmagupta'||kind==='bhaskara'){
    const tall=kind==='bhaskara';
    top=`<path d="M84,132 C76,${tall?50:62} 118,${tall?26:40} 150,${tall?26:40} C182,${tall?26:40} 224,${tall?50:62} 216,132 C190,112 110,112 84,132Z" fill="#efe2c4" ${PEN.replace('fill="none"','')}/>
      <path ${PEN} d="M90,114 C128,86 178,86 210,114 M96,96 C130,68 176,68 204,96 M108,${tall?74:78} C134,${tall?52:58} 168,${tall?52:58} 192,${tall?74:78}"/>
      ${tall?'<circle cx="150" cy="84" r="10" fill="#3a332d"/><path '+PEN+' d="M150,74 q14,-22 4,-40"/>':''}`;
    extra= tall? `<path ${PEN} d="M124,190 q-12,4 -16,-8 M124,190 q26,-10 52,0 q12,4 16,-8"/><path d="M146,108 v16 M154,108 v16" stroke="#3a332d" stroke-width="3"/>`
      : `<path d="M108,190 C112,236 135,256 150,260 C165,256 188,236 192,190 C175,214 125,214 108,190Z" fill="#cdbb98" ${PEN.replace('fill="none"','')}/><path d="M108,190 C112,236 135,256 150,260 C165,256 188,236 192,190 C175,214 125,214 108,190Z" fill="url(#hatch2)" opacity=".45"/><path ${PEN} d="M128,192 q22,-10 44,0"/>`;
    body=sh('#e4d3b0')+`<path ${PEN} d="M110,256 L150,312 L190,256"/>`;
  } else if(kind==='wallis'||kind==='newton'){
    const c=kind==='wallis'?'#b8a383':'#d4c3a2';
    back=`<path d="M88,118 C62,190 66,282 98,326 L134,326 C114,262 110,190 110,150 Z" fill="${c}" ${PEN.replace('fill="none"','')}/>
      <path d="M212,118 C238,190 234,282 202,326 L166,326 C186,262 190,190 190,150 Z" fill="${c}" ${PEN.replace('fill="none"','')}/>
      <path ${PEN} d="M84,170 q12,10 4,24 q-10,14 2,28 q12,14 2,30 M216,170 q-12,10 -4,24 q10,14 -2,28 q-12,14 -2,30" opacity=".8"/>`;
    top=`<path d="M90,134 C92,68 208,68 210,134 C196,104 160,94 150,92 C140,94 104,104 90,134Z" fill="${c}" ${PEN.replace('fill="none"','')}/>${kind==='newton'?'<path '+PEN+' d="M150,80 q-6,10 0,16"/>':''}`;
    body=sh(kind==='wallis'?'#4a413a':'#cdb995');
    if(kind==='wallis') extra=`<rect x="136" y="252" width="12" height="40" fill="#fff" ${PEN.replace('fill="none"','')}/><rect x="152" y="252" width="12" height="40" fill="#fff" ${PEN.replace('fill="none"','')}/>`;
  } else if(kind==='leibniz'){
    back=`<path d="${curls(150,175,92,128,Math.PI*.78,Math.PI*2.22,24,17)}" fill="#c9b591" ${PEN.replace('fill="none"','')}/>`;
    top=`<path d="${curls(150,100,52,30,Math.PI*1.05,Math.PI*1.95,7,13)}" fill="#c9b591" ${PEN.replace('fill="none"','')}/>`;
    body=sh('#bfa883')+`<path ${PEN} d="M132,256 q18,26 36,0 M136,262 q14,20 28,0"/>`;
  }
  return `<svg viewBox="0 0 300 340" xmlns="http://www.w3.org/2000/svg"><g filter="url(#pencil)">${back}${body}${neck}${head}${face}${top}${extra}</g></svg>`;
}
function runnerD(phi){
  const H=[56,84], S=[64,46], L=(a,l,p)=>[p[0]+l*Math.sin(a),p[1]+l*Math.cos(a)], f=p=>p[0].toFixed(1)+','+p[1].toFixed(1);
  let d=`M${f(S)} L${f(H)} `;
  [0,Math.PI].forEach(o=>{const ph=phi+o,th=.65*Math.sin(ph),kn=L(th,32,H),ft=L(th-1.0*(.55+.45*Math.sin(ph-1.3)),32,kn);d+=`M${f(H)} L${f(kn)} L${f(ft)} `;
    const ua=-.75*Math.sin(ph),el=L(ua,22,S),hd=L(ua+1.9,20,el);d+=`M${f(S)} L${f(el)} L${f(hd)} `;});
  return d;}
function runnerSvg(cls){return `<svg viewBox="0 0 130 170" width="130" height="170" style="overflow:visible"><g filter="url(#pencil)">
  <circle cx="70" cy="27" r="14" fill="#efe6d6" ${PEN.replace('fill="none"','')} stroke-width="4"/>
  <path class="${cls||''}" d="${runnerD(0.6)}" ${PEN} stroke-width="7"/></g></svg>`;}
function quillSvg(){return `<svg viewBox="0 0 140 300" width="140" height="300" style="overflow:visible"><g filter="url(#pencil)">
  <path d="M10,292 C30,220 60,120 128,8 C110,90 90,170 40,238 Z" fill="#f4ecdc" ${PEN.replace('fill="none"','')}/>
  <path ${PEN} d="M12,290 C40,210 80,110 126,12"/>
  <path d="M40,230 l-12,-10 M52,206 l-14,-12 M64,182 l-15,-13 M76,158 l-16,-14 M88,134 l-16,-14 M100,108 l-14,-14 M110,84 l-12,-14 M58,212 l22,-4 M72,186 l24,-6 M86,160 l24,-8 M98,134 l20,-8"
     stroke="#3a332d" stroke-width="2" opacity=".55"/>
  <path d="M10,292 l8,-26 l6,4 z" fill="#1E1A16"/></g></svg>`;}
function flagSvg(check){return `<svg viewBox="0 0 80 140" width="80" height="140"><g filter="url(#pencil)">
  <path ${PEN} stroke-width="5" d="M10,138 L10,8"/>
  ${check?'<rect x="10" y="10" width="60" height="40" fill="#fff" '+PEN.replace('fill="none"','')+'/><path d="M10,10h15v10h-15zM40,10h15v10h-15zM25,20h15v10h-15zM55,20h15v10h-15zM10,30h15v10h-15zM40,30h15v10h-15zM25,40h15v10h-15zM55,40h15v10h-15z" fill="#1E1A16"/>'
         :'<path d="M10,10 L66,26 L10,44 Z" fill="#E8892B" '+PEN.replace('fill="none"','')+'/>'}</g></svg>`;}
function miniGraph(w){return `<svg viewBox="0 0 300 300" width="${w}" height="${w}" style="background:#f6f1e4"><rect width="300" height="300" fill="url(#grid)"/>
  <path d="M20,150 H280 M150,280 V20" stroke="${INK}" stroke-width="4"/>
  <path d="M158,22 Q162,138 280,142" stroke="${INK}" stroke-width="6" fill="none"/><path d="M142,278 Q138,162 20,158" stroke="${INK}" stroke-width="6" fill="none"/></svg>`;}

/* ============ scene framework ============ */
const scenes=[], SFX=[], SHAKES=[], DRAWS=[];
let CUR=null;
function scene(start,end,bgUrl,opt={}){
  const root=$(`<div class="scene"><div class="cam"></div></div>`); document.getElementById('scenes').appendChild(root);
  const cam=root.firstElementChild, layers=[];
  [.25,.6,1,1.45].forEach(d=>{const L=$(`<div class="layer"></div>`);cam.appendChild(L);layers.push({el:L,d});});

           dur:o.dur||({slide:.6,pop:.42,slam:.35,stamp:.26,fade:.45,none:.01}[fx]),seed:Math.random()*0+(CUR.anims.length*1.7+o.x*.01)};

function applyAnim(a,t){

  if(q<0){o=0;}else{const c=Math.min(q,1);
    switch(a.fx){
      case 'slide':{const e=backOut(c,1.5);x=a.dx*(1-e);y=a.dy*(1-e);r=a.r+a.r0*(1-e);o=Math.min(1,q*5);break;}
      case 'pop': s=c<.6?.6+.45*p2o(c/.6):1.05-.05*p2o((c-.6)/.4); o=Math.min(1,q*6); r=a.r+(1-c)*a.r0*.5; break;
      case 'slam': s=1.4-.4*p3o(c); o=Math.min(1,q*8); break;
      case 'stamp': s=2.1-1.1*p3o(c); o=Math.min(1,q*7); r=a.r+(1-c)*a.r0; break;

  if(a.wob){r+=Math.sin(t*1.5+a.seed)*1.0;y+=Math.sin(t*1.1+a.seed*2)*3.5;x+=Math.cos(t*.8+a.seed)*2;}
  a.el.style.opacity=o.toFixed(3); a.el.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${r.toFixed(2)}deg) scale(${s.toFixed(4)})`;
}

let TRANS=[];

/* ============ captions ============ */
const CH=[];
function buildCaps(){
  const box=document.getElementById('caps'); let cur=[];
  const flush=()=>{if(cur.length){CH.push(cur);cur=[];}};
  W.forEach((w,i)=>{cur.push(w);const end=/[.?!]$/.test(w.w), soft=/[,:;]$/.test(w.w);
    if(cur.length>=4||end||(soft&&cur.length>=2))flush();});
  flush();
  CH.forEach((c,ci)=>{const el=$(`<div class="chunk">${c.map(w=>`<span>${w.w.replace(/[,.:;]$/,'')}</span>`).join(' ')}</div>`);box.appendChild(el);
    c.el=el;c.spans=[...el.children];c.t0=c[0].s-.04;});
  CH.forEach((c,ci)=>{const nx=CH[ci+1];c.t1=Math.min(nx?nx[0].s-.04:DUR,c[c.length-1].e+.7);});
}
function caps(t){
  for(const c of CH){const on=t>=c.t0&&t<c.t1;c.el.style.display=on?'block':'none';if(!on)continue;
    const k=clamp((t-c.t0)/.12);c.el.style.transform=`translateY(${(1-p3o(k))*18}px)`;c.el.style.opacity=k;
    c.forEach((w,i)=>{const nx=c[i+1];const act=t>=w.s-.03&&t<(nx?nx.s-.03:c.t1);const sp=c.spans[i];
      sp.className=act?'on':'';const kk=clamp((t-w.s+.03)/.1);sp.style.transform=act?`scale(${(.85+.15*p3o(kk)+ (kk<1?.06*Math.sin(kk*Math.PI):0)).toFixed(3)})`:'';});}
}

/* ============ render ============ */
function render(t){
  let s=scenes.find(sc=>t>=sc.start&&t<sc.end)||scenes[scenes.length-1];
  scenes.forEach(sc=>{const v=sc===s;if(sc._v!==v){sc.root.style.display=v?'block':'none';sc._v=v;}});
  const p=clamp((t-s.start)/(s.end-s.start)), sh=shake(t);
  s.cam.style.transform=`translate(${sh.x.toFixed(2)}px,${sh.y.toFixed(2)}px) scale(${(1+.06*p3io(p)*.5+.03*p).toFixed(4)})`;
  s.layers.forEach(L=>{L.el.style.transform=`translate(${(L.d*(p-.5)*-34).toFixed(2)}px,${(L.d*(p-.5)*-22).toFixed(2)}px)`;});
  const pbg=s.layers[0].el.querySelector('.bg'); if(pbg) pbg.style.transform=`scale(${(1.08-.08*p3o(clamp((t-s.start)/.4))).toFixed(4)})`;
  s.anims.forEach(a=>applyAnim(a,t));
  for(const d of DRAWS){const k=clamp((t-d.at)/d.dur);d.p.style.strokeDashoffset=((d.L+2)*(1-p2o(k))).toFixed(1);d.p.style.opacity=t<d.at?0:1;}
  s.update&&s.update(t);
  caps(t);
  // grain
  const f=Math.floor(t*FPS), R=rng(f*31+7); const g=document.getElementById('grain'); g.style.backgroundPosition=`${Math.floor(R()*740)}px ${Math.floor(R()*1160)}px`;
  // transitions
  const tear=document.getElementById('tear'), fl=document.getElementById('flash'); let tv=false, fo=0;
  for(const tr of TRANS){const dt=t-tr.t;
    if(tr.type==='tear'&&dt>-.28&&dt<.28){tv=true;const k=(dt+.28)/.56;tear.style.left=lerp(1080,-1450,p2io(k))+'px';tear.style.transform='rotate(-2deg)';}
    if(tr.type==='page'&&dt>-.3&&dt<.3){tv=true;const k=(dt+.3)/.6;tear.style.left=lerp(1080,-1450,p3io(k))+'px';tear.style.transform=`perspective(1600px) rotateY(${lerp(-35,35,k)}deg) skewY(${lerp(-4,4,k)}deg)`;}
    if(tr.type==='flash'&&dt>=0&&dt<.18) fo=Math.max(fo,1-dt/.18);}
  tear.style.display=tv?'block':'none'; fl.style.opacity=fo.toFixed(2);
  document.getElementById('fade').style.opacity=clamp((t-69.3)/.47).toFixed(3);
}

(async()=>{
  const fams=["Anton","Archivo Black","Special Elite","Caveat","Tiro Devanagari Sanskrit","EB Garamond"];

  if(location.hash==='#play'){const st=performance.now();const loop=()=>{render(((performance.now()-st)/1000)%DUR);requestAnimationFrame(loop);};loop();}
})();
